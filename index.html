<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Senior Care Services</title>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root { --gold: #d4af37; --black: #000000; --dark-gray: #1a1a1a; }
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body { background-color: var(--black); color: #ffffff; font-family: 'Lato', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 10px; }

        .presentation-card { background-color: var(--black); width: 100%; max-width: 350px; border: 1px solid var(--gold); border-radius: 12px; padding: 15px; text-align: center; }

        .logo-section { margin-bottom: 10px; }
        .main-logo { width: 100px; height: auto; margin-bottom: 5px; }
        .main-subtitle { font-size: 0.6rem; letter-spacing: 2px; color: #888; text-transform: uppercase; margin-bottom: 10px; }

        /* Botón mucho más chico */
        .btn-save { 
            width: 100%; max-width: 180px; 
            padding: 5px 10px; 
            background-color: var(--gold); 
            color: black; 
            font-weight: 900; 
            text-transform: uppercase; 
            border-radius: 4px; 
            border: none; 
            cursor: pointer; 
            margin: 0 auto 15px auto; 
            display: block; 
            transition: 0.3s; 
            font-size: 0.65rem;
        }
        .btn-save span { display: block; font-size: 0.6rem; font-weight: 700; margin-top: 1px; }

        .quick-actions { display: flex; justify-content: center; gap: 15px; margin-bottom: 15px; }
        .action-circle { width: 35px; height: 35px; border: 1px solid var(--gold); border-radius: 50%; display: flex; justify-content: center; align-items: center; color: var(--gold); text-decoration: none; font-size: 0.9rem; }

        .services-grid { display: flex; flex-direction: column; gap: 5px; border-top: 1px solid #333; padding-top: 10px; }
        .service-item { background: var(--dark-gray); padding: 5px 10px; border-radius: 4px; font-size: 0.6rem; color: #ccc; text-transform: uppercase; text-align: left; display: flex; align-items: center; gap: 8px; }
        .service-item i { color: var(--gold); font-size: 0.8rem; }

        .footer-quote { margin-top: 15px; font-style: italic; color: #fff; font-size: 0.7rem; line-height: 1.3; }
    </style>
</head>
<body>

    <div class="presentation-card">
        <div class="logo-section">
            <img src="logo.png" alt="Logo" class="main-logo">
            <p class="main-subtitle">Senior Care Services</p>
        </div>

        <button onclick="downloadVCard()" class="btn-save">
            SAVE CONTACT
            <span>(949) 259 8937</span>
        </button>

        <div class="quick-actions">
            <a href="tel:+19492598937" class="action-circle"><i class="fa-solid fa-phone"></i></a>
            <a href="mailto:Cbravoflores@icloud.com" class="action-circle"><i class="fa-solid fa-envelope"></i></a>
            <a href="sms:+19492598937" class="action-circle"><i class="fa-solid fa-comment-dots"></i></a>
        </div>

        <div class="services-grid">
            <div class="service-item"><i class="fa-solid fa-house-chimney"></i> Home Visits</div>
            <div class="service-item"><i class="fa-solid fa-utensils"></i> Meal Prep</div>
            <div class="service-item"><i class="fa-solid fa-heart-pulse"></i> Personal Care & Medication Assistance</div>
        </div>

        <div class="footer-quote">"Compassionate care tailored to your loved ones' needs."</div>
    </div>

    <script>
        function downloadVCard() {
            const base64Logo = "AQUI_VA_TU_CODIGO_BASE64"; 
            const vcardContent = "BEGIN:VCARD\nVERSION:3.0\nFN:Senior Care Services\nORG:Senior Care Services\nPHOTO;ENCODING=b;TYPE=PNG:" + base64Logo + "\nTEL;TYPE=CELL:+19492598937\nNOTE:Home Visits, Meal Prep, Personal Care & Medication Assistance.\nEND:VCARD";
            const blob = new Blob([vcardContent], { type: "text/vcard" });
            const url = window.URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.setAttribute('download', 'Senior_Care_Contact.vcf');
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
