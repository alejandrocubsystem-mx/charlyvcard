<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Senior Care Services</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root { --gold: #d4af37; --black: #000000; --dark-gray: #1a1a1a; }
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body { background-color: var(--black); color: #ffffff; font-family: 'Lato', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }

        .presentation-card { background-color: var(--black); width: 100%; max-width: 500px; border: 2px solid var(--gold); border-radius: 8px; padding: 60px 20px; text-align: center; }

        .main-logo { width: 350px; max-width: 90%; margin-bottom: 25px; filter: drop-shadow(0 0 20px rgba(212, 175, 55, 0.4)); }

        .btn-main { width: 100%; max-width: 300px; padding: 18px; background-color: var(--gold); color: black; font-weight: 900; text-transform: uppercase; border-radius: 4px; border: none; cursor: pointer; margin: 10px 0; display: block; margin-left: auto; margin-right: auto; }

        .btn-secondary { background: transparent; border: 1px solid var(--gold); color: var(--gold); }
        .btn-secondary:hover { background: var(--gold); color: black; }

        /* Modal Styles */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: var(--dark-gray); padding: 40px; border: 1px solid var(--gold); width: 90%; max-width: 400px; border-radius: 8px; position: relative; }
        .close-modal { position: absolute; top: 10px; right: 20px; color: var(--gold); font-size: 2rem; cursor: pointer; }

        .service-item { padding: 15px; border-bottom: 1px solid #333; display: flex; align-items: center; gap: 15px; }
        .service-item i { color: var(--gold); font-size: 1.5rem; }

        .footer-quote { padding-top: 40px; font-style: italic; color: #aaa; font-size: 0.9rem; }
    </style>
</head>
<body>

    <div class="presentation-card">
        <img src="logo.png" alt="Logo" class="main-logo">
        
        <button onclick="downloadVCard()" class="btn-main">SAVE CONTACT</button>
        <button onclick="openModal()" class="btn-main btn-secondary">VIEW SERVICES</button>
        
        <div style="display:flex; justify-content:center; gap:20px; margin-top:20px;">
            <a href="tel:+19492598937" style="color:var(--gold); font-size:1.5rem;"><i class="fa-solid fa-phone"></i></a>
            <a href="sms:+19492598937" style="color:var(--gold); font-size:1.5rem;"><i class="fa-solid fa-comment-dots"></i></a>
        </div>

        <div class="footer-quote">Compassionate care tailored to the needs of your loved ones</div>
    </div>

    <div id="servicesModal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal()">&times;</span>
            <h2 style="color:var(--gold); margin-bottom:20px; text-align:center;">Our Services</h2>
            <div class="service-item"><i class="fa-solid fa-house-chimney"></i> <span>Home Visits</span></div>
            <div class="service-item"><i class="fa-solid fa-utensils"></i> <span>Meal Prep</span></div>
            <div class="service-item"><i class="fa-solid fa-heart-pulse"></i> <span>Personal Care & Medication Assistance</span></div>
        </div>
    </div>

    <script>
        function openModal() { document.getElementById('servicesModal').style.display = 'flex'; }
        function closeModal() { document.getElementById('servicesModal').style.display = 'none'; }
        
        function downloadVCard() {
            const base64Logo = "AQUI_VA_TU_CODIGO_BASE64"; 
            const vcardContent = "BEGIN:VCARD\nVERSION:3.0\nFN:Senior Care Services\nORG:Senior Care Services\nTITLE:Professional Care\nPHOTO;ENCODING=b;TYPE=PNG:" + base64Logo + "\nTEL;TYPE=CELL:(949) 259 8937\nNOTE:Home Visits, Meal Prep, Personal Care & Medication Assistance.\nEND:VCARD";
            const blob = new Blob([vcardContent], { type: "text/vcard" });
            const url = window.URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.setAttribute('download', 'Senior_Care_Contact.vcf');
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
