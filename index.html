<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Senior Care Services</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root { --gold: #d4af37; --black: #000000; --dark-gray: #1a1a1a; }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--black);
            color: #ffffff;
            font-family: 'Lato', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center; /* Centrado vertical */
            min-height: 100vh;
            padding: 10px;
        }

        .presentation-card {
            background-color: var(--black);
            width: 100%;
            max-width: 450px; /* Tamaño máximo más contenido */
            border: 1px solid var(--gold);
            border-radius: 12px;
            padding: 25px 15px;
            text-align: center;
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.15);
        }

        .logo-section { padding: 10px 0 20px; }
        
        .main-logo { 
            width: 100%; 
            max-width: 250px; /* Logo grande pero controlado */
            height: auto; 
            margin-bottom: 10px; 
        }

        .main-subtitle { font-size: 0.85rem; letter-spacing: 4px; color: #888; text-transform: uppercase; margin-bottom: 20px; }

        .btn-save { 
            width: 100%; padding: 15px; background-color: var(--gold); color: black; 
            font-weight: 900; text-transform: uppercase; border-radius: 4px; border: none; cursor: pointer; 
            margin-bottom: 20px; transition: 0.3s;
        }

        .quick-actions { display: flex; justify-content: center; gap: 20px; margin-bottom: 25px; }

        .action-circle { 
            width: 50px; height: 50px; border: 1px solid var(--gold); border-radius: 50%; 
            display: flex; justify-content: center; align-items: center; 
            color: var(--gold); text-decoration: none; font-size: 1.3rem; 
        }

        .services-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 10px; }

        .service-item { 
            background: var(--dark-gray); padding: 10px 5px; border-radius: 4px; 
            font-size: 0.7rem; color: #fff; text-transform: uppercase;
        }

        .service-item i { display: block; color: var(--gold); margin-bottom: 5px; font-size: 1.1rem; }

        .footer-quote { margin-top: 25px; font-style: italic; color: #666; font-size: 0.75rem; }
    </style>
</head>
<body>

    <div class="presentation-card">
        <div class="logo-section">
            <img src="logo.png" alt="Logo" class="main-logo">
            <p class="main-subtitle">Senior Care Services</p>
        </div>

        <button onclick="downloadVCard()" class="btn-save">SAVE CONTACT</button>

        <div class="quick-actions">
            <a href="tel:+19492598937" class="action-circle"><i class="fa-solid fa-phone"></i></a>
            <a href="mailto:Cbravoflores@icloud.com" class="action-circle"><i class="fa-solid fa-envelope"></i></a>
            <a href="sms:+19492598937" class="action-circle"><i class="fa-solid fa-comment-dots"></i></a>
        </div>

        <div class="services-grid">
            <div class="service-item"><i class="fa-solid fa-house-chimney"></i> Home</div>
            <div class="service-item"><i class="fa-solid fa-utensils"></i> Meals</div>
            <div class="service-item"><i class="fa-solid fa-heart-pulse"></i> Care</div>
        </div>

        <div class="footer-quote">"Compassionate care tailored to the needs of your loved ones."</div>
    </div>

    <script>
        function downloadVCard() {
            const base64Logo = "AQUI_VA_TU_CODIGO_BASE64"; 
            const vcardContent = "BEGIN:VCARD\nVERSION:3.0\nFN:Senior Care Services\nORG:Senior Care Services\nPHOTO;ENCODING=b;TYPE=PNG:" + base64Logo + "\nTEL;TYPE=CELL:+19492598937\nNOTE:Home Visits, Meal Prep, Personal Care & Medication Assistance.\nEND:VCARD";
            const blob = new Blob([vcardContent], { type: "text/vcard" });
            const url = window.URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.setAttribute('download', 'Senior_Care_Contact.vcf');
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
